# Sync paddle data: USAP list + optional CSV import
# Runs daily and on manual trigger. Requires repo secret DATABASE_URL.

name: Sync paddle data

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync USAP approved paddles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run sync:usap

      - name: Import CSV seed (optional)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run import
        continue-on-error: true
